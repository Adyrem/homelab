# VM disks on SSD pool — snapshot daily/weekly
[rpool/data]
    use_template = vms
    recursive = yes

# Proxmox OS root — lighter schedule, mainly for recovery
[rpool/ROOT]
    use_template = system
    recursive = yes

#############################
[template_vms]
    daily = 7
    weekly = 4
    monthly = 0
    hourly = 0
    frequently = 0
    autosnap = yes
    autoprune = yes

[template_system]
    daily = 3
    weekly = 2
    monthly = 0
    hourly = 0
    frequently = 0
    autosnap = yes
    autoprune = yes
