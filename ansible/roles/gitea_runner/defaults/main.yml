---
gitea_runner_version: "0.2.11"
gitea_runner_url: "http://10.10.1.125:3000"
gitea_runner_name: "{{ inventory_hostname }}"
gitea_runner_labels: "native:host"
gitea_runner_registration_token: "{{ vault_gitea_runner_token }}"
# Memory cap per CI job. The runner shares the 2 GB Gitea VM with Gitea and
# PostgreSQL (~850 MB in use at rest); an uncapped job starves them and takes
# Gitea down. Applies to docker jobs (container options) and host jobs (systemd).
gitea_runner_memory_mb: 768
