---
# Quackpot: the donation page and server for the StreamOverlay plugin (Deno, SQLite).
# The code is copied from a local checkout until it has a GitHub repo.
quackpot_source: "{{ lookup('env', 'HOME') }}/dev/quackpot"
quackpot_deno_version: "2.9.8"
quackpot_port: 8787
quackpot_dir: /opt/quackpot
quackpot_data_dir: /var/lib/quackpot
# Only the reverse proxy may reach it, and only its X-Forwarded-For is believed
quackpot_proxy_ip: "10.10.1.3"
# The DNS resolver (Pi-hole); the only private address Quackpot's own connections may reach
quackpot_dns_ip: "10.10.1.2"
# Creates rooms without any limit; nobody needs it while anyone may create rooms
quackpot_admin_token: "{{ vault_quackpot_admin_token }}"
# Anyone may create a room on the start page or from the plugin (3 a day per address, 50 a day in all);
# rooms whose plugin never connects are removed after a week
quackpot_open_rooms: true
# Overrides for the game's and the duck's numbers, written to /etc/quackpot/config.json;
# see quackpot.config.example.json in the quackpot repo. Empty: the built-in defaults.
quackpot_game_config: {}
# Sounds for the moments on the stream, copied from files/sounds/ to here (inside the data directory,
# which the service may read). The Tetris ones are the "Boom! Tetris for Jeff!" calls, made with the
# quackpot repo's tools/tetris-clips.sh; they aren't in that repo.
quackpot_sounds_dir: "{{ quackpot_data_dir }}/sounds"
# YouTube links pasted on the page become clips: yt-dlp (the official release, kept up to date,
# since YouTube keeps breaking older ones) finds the video, ffmpeg (Debian's) cuts it
quackpot_yt_dlp: /usr/local/bin/yt-dlp
quackpot_ffmpeg: /usr/bin/ffmpeg
quackpot_tetris_sounds:
  - boom-tetris-1.ogg
  - boom-tetris-2.ogg
  - boom-tetris-3.ogg
  - boom-tetris-4.ogg
  - boom-tetris-5.ogg
  - boom-tetris-6.ogg
